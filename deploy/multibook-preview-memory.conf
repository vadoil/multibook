# systemd drop-in: multibook-preview.service.d/memory.conf
# The application shares a 2 GB host. Bound the JS heap and native allocator;
# MemoryHigh below native RSS can trap the process in continuous reclaim.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=192
Environment=MALLOC_ARENA_MAX=2
Environment=UV_THREADPOOL_SIZE=2
MemoryHigh=infinity
MemoryMax=512M
TimeoutStopSec=15
